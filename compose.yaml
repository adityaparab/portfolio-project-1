name: invoiceops

services:
  api:
    build: .
    image: invoiceops-api:local
    restart: unless-stopped
    # Migrate on boot, then serve (dev convenience; prod would run these apart).
    command:
      ["sh", "-c", "uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn invoiceops_agent.api.main:app --host 0.0.0.0 --port 8000"]
    environment:
      # App connects as the least-privilege role; migrations as the owner (#7)
      INVOICEOPS_DATABASE_DSN: postgresql://invoiceops_app:invoiceops-app@postgres:5432/invoiceops
      INVOICEOPS_ALEMBIC_DSN: postgresql://invoiceops:invoiceops@postgres:5432/invoiceops
      INVOICEOPS_MINIO_BASE_URL: http://minio:9000
      # Gateway endpoint comes from .env (native proxy by default — see .env.example)
      INVOICEOPS_LITELLM_BASE_URL: ${INVOICEOPS_LITELLM_BASE_URL:-http://host.docker.internal:4000}
      INVOICEOPS_LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-dev}
      INVOICEOPS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the native proxy on the host
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceops
      POSTGRES_PASSWORD: invoiceops
      POSTGRES_DB: invoiceops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceops -d invoiceops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s   # fresh initdb (+ init scripts) takes >10s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: invoiceops
      MINIO_ROOT_PASSWORD: invoiceops-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  # OPTIONAL self-hosted proxy — only needed without a native LiteLLM proxy.
  # Dev default: the app talks to the native proxy directly (.env URL).
  # Prod/eval: LITELLM_CONFIG=/etc/litellm/config.prod.yaml
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    profiles: ["proxy"]
    command: ["--config", "${LITELLM_CONFIG:-/etc/litellm/config.yaml}", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NATIVE_PROXY_BASE_URL: ${NATIVE_PROXY_BASE_URL:-http://host.docker.internal:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # dev Ollama on the host (Linux)
    volumes:
      - ./deploy/litellm:/etc/litellm:ro
    ports:
      - "4400:4000"   # host 4000 already in use (native LiteLLM); internal port unchanged
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  # One-shot synthetic-ERP seeder — implemented with issue #20.
  seed:
    image: invoiceops-api:local
    profiles: ["seed"]
    command: ["python", "-c", "print('seed placeholder — synthetic ERP generator lands with issue #20')"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
