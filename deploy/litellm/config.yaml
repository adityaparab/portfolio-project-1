# LiteLLM proxy routing — DEVELOPMENT profile (local Ollama backends).
#
# Application code addresses models ONLY by virtual alias (model_name below).
# Switching dev/prod = point LITELLM_CONFIG at config.prod.yaml (see compose.yaml);
# never a code change. Adding an alias: append a model_list entry here AND in
# config.prod.yaml, then update the gateway client's alias type if applicable.
#
# Dev backends expect Ollama on the host, reached via host.docker.internal:11434
# (extra_hosts in compose.yaml maps it on Linux). Model choices for dev:
#   extract-vision → qwen2.5vl:7b   (vision-capable extraction)
#   triage-reasoner → qwen2.5:7b    (general reasoning, structured output)
#   eval-judge → qwen2.5:7b         (grading, versioned prompt — same class OK in dev)
#   embed → nomic-embed-text        (embeddings for near-dup)
model_list:
  - model_name: extract-vision
    litellm_params:
      model: ollama/qwen2.5vl:7b
      api_base: http://host.docker.internal:11434

  - model_name: triage-reasoner
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434

  - model_name: eval-judge
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434

  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

router_settings:
  timeout: 120
  retries: 2
  allowed_fails: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
