# LiteLLM routing — DEVELOPMENT profile, backed by the developer's NATIVE
# LiteLLM proxy (OpenAI-compliant API on the host).
#
# Application code addresses models ONLY by virtual alias (model_name below).
# The gateway base URL and key come from the environment (.env — see
# .env.example): INVOICEOPS_LITELLM_BASE_URL / LITELLM_API_KEY. This file only
# matters when running the optional self-hosted proxy service
# (`docker compose --profile proxy up`); with a native proxy present, the app
# talks to it directly and this file is unused.
#
# Dev backend models (native proxy):
#   extract-vision   → openai/glm-ocr           (vision/OCR extraction)
#   triage-reasoner  → openai/qwen38            (reasoning + structured output)
#   eval-judge       → openai/compass-judger    (grading, versioned prompt)
#   embed            → openai/nomic-embed       (near-duplicate embeddings)
model_list:
  - model_name: extract-vision
    litellm_params:
      model: openai/glm-ocr
      api_base: os.environ/NATIVE_PROXY_BASE_URL
      api_key: os.environ/LITELLM_API_KEY

  - model_name: triage-reasoner
    litellm_params:
      model: openai/qwen38
      api_base: os.environ/NATIVE_PROXY_BASE_URL
      api_key: os.environ/LITELLM_API_KEY

  - model_name: eval-judge
    litellm_params:
      model: openai/compass-judger
      api_base: os.environ/NATIVE_PROXY_BASE_URL
      api_key: os.environ/LITELLM_API_KEY

  - model_name: embed
    litellm_params:
      model: openai/nomic-embed
      api_base: os.environ/NATIVE_PROXY_BASE_URL
      api_key: os.environ/LITELLM_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

router_settings:
  timeout: 120
  retries: 2
  allowed_fails: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
