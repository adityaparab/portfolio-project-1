[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoiceops-agent"
version = "0.1.0"
description = "Agentic, human-in-the-loop invoice processing for Source-to-Pay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "minio>=7.2.20",
    "openai>=3.5.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "testcontainers>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceops_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", "docs", "mocks", "deploy", "adr"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests — no network, no containers",
    "integration: tests requiring Postgres/MinIO/stack services (testcontainers)",
]
asyncio_mode = "strict"
