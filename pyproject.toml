[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoiceops-agent"
version = "0.1.0"
description = "Agentic, human-in-the-loop invoice processing for Source-to-Pay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceops_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", "docs", "mocks", "deploy", "adr"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests — no network, no containers",
    "integration: tests requiring Postgres/MinIO/stack services (testcontainers)",
]
asyncio_mode = "strict"
