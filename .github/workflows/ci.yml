name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  unit:
    name: pytest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m unit -v

  # Integration (testcontainers) and eval-gate stages land with issues #25→#27
  # and #50; kept here as a wired-but-empty scaffold. Exit code 5 = "no tests
  # collected" and is treated as pass until the first integration test arrives.
  integration:
    name: pytest (integration — scaffold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run integration tests
        run: |
          set +e
          uv run pytest -m integration -v
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "No integration tests collected yet — scaffold passes."
            exit 0
          fi
          exit "$status"

  frontend:
    name: frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (Playwright smoke · Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boot the single-image stack (api serves the built SPA on :8000)
        working-directory: .
        run: |
          docker compose build api
          docker compose up -d api
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/healthz >/dev/null && curl -sf http://localhost:8000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/healthz
          curl -sf http://localhost:8000/ | grep -q InvoiceOps
      - run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8000
      - name: Capture failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stack logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs api ui | tail -200
